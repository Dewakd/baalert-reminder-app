[package]
name = "baalert"
version = "0.1.4"
description = "A desktop pet that delivers animated reminders"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "baalert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# macOS: objc2 is already compiled as a Tauri transitive dep — same version, no conflicts.
# raw-window-handle gives us the NSView pointer reliably without ns_window().
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
raw-window-handle = "0.6"
